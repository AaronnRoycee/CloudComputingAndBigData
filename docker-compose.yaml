# Local development.  Start:  docker compose up -d --build   then open http://localhost:8081
services:
  gallery:
    build: .
    image: cse6332-project1
    container_name: cse6332-project1
    restart: unless-stopped
    environment:
      PORT: "8080"
    ports:
      # 8081 on the host to stay clear of the course container's 8080.
      - "127.0.0.1:8081:8080"
