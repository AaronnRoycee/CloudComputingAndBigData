<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>6332 Cloud Computing &amp; Big Data</title>
  <meta name="description" content="Project 1 image gallery for CSE 6332 Cloud Computing and Big Data.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <h1>6332 Cloud Computing &amp; Big Data</h1>
    <p class="subtitle">Project 1 &mdash; a containerized image gallery. Select any image to enlarge it.</p>
  </header>

  <main>
    <ul id="gallery" class="gallery" aria-busy="true">
      <li class="gallery-empty">Loading gallery&hellip;</li>
    </ul>
  </main>

  <footer class="site-footer">
    <p>Aaron Pantoja &middot; CSE 6332 &middot; Served by nginx in a Docker container</p>
  </footer>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightbox-title" hidden>
    <button id="lightbox-close" class="lightbox-btn lightbox-close" type="button" aria-label="Close enlarged view">&times;</button>
    <button id="lightbox-prev" class="lightbox-btn lightbox-nav lightbox-prev" type="button" aria-label="Previous image">&#8249;</button>
    <button id="lightbox-next" class="lightbox-btn lightbox-nav lightbox-next" type="button" aria-label="Next image">&#8250;</button>

    <figure class="lightbox-figure">
      <picture>
        <source id="lightbox-avif" type="image/avif">
        <img id="lightbox-img" class="lightbox-img" src="" alt="">
      </picture>
      <figcaption class="lightbox-caption">
        <h2 id="lightbox-title"></h2>
        <p id="lightbox-description"></p>
        <p id="lightbox-counter" class="lightbox-counter"></p>
      </figcaption>
    </figure>
  </div>

  <script src="js/gallery.js"></script>
</body>
</html>
